name: orbits_flutter
description: Orbits — Flutter P2P messenger. 1:1 chats use X3DH + Double Ratchet; rooms are host-plaintext. Default signalling and STUN use public third-party servers.
publish_to: 'none'
version: 9.0.7+907

environment:
  # Flutter 3.44 is the first project-pinned line validated against the 2026
  # App Store requirement (Xcode 26 / iOS 26 SDK). CI, FVM and this manifest
  # intentionally agree on the same patch release.
  sdk: ">=3.12.0 <3.13.0"
  flutter: ">=3.44.7 <3.45.0"

dependencies:
  flutter:
    sdk: flutter

  # Direct raw-SQLite access for the startup health check (PRAGMA quick_check
  # + quarantine of a corrupt DB file, Round 5 B.3). Already a transitive dep
  # of drift — pinned explicitly so importing it isn't a lint violation.
  sqlite3: ^2.9.0

  # Path joining for the DB health check (transitive everywhere already).
  path: ^1.9.0

  # Crypto (porting src/core/crypto.js, doubleRatchet.js, x3dh.js, identityKey.js)
  #
  # `cryptography_flutter` was originally listed here for the native-backed
  # impls (Secure Enclave on iOS, AndroidKeyStore on Android). It's been
  # dropped because:
  #   • Nothing under lib/ actually imports it — the pure-Dart `cryptography`
  #     package covers every algorithm we use (AES-GCM, PBKDF2, HKDF,
  #     ECDH-P256, ECDSA-P256). Native-backed mode requires an explicit
  #     `FlutterCryptography.enable()` call that was never wired in.
  #   • 2.3.4 (what pub picks for ^2.3.2 on Dart 3.8) ships a broken
  #     `_internal.dart` ("Undefined name 'internal'") and 2.3.2's
  #     `android/build.gradle` is missing a namespace, which AGP 8.x
  #     rejects — that was the actual root cause of the Android build
  #     failure post-Kotlin-2.x fix.
  # Add it back (and pin a stable release) if/when we ever turn on
  # hardware-backed crypto.
  cryptography: ^2.7.0           # AES-GCM, PBKDF2, HKDF, ECDH P-256, ECDSA P-256
  pointycastle: ^3.9.1           # scrypt (the cryptography package doesn't ship it)
  convert: ^3.1.1                # hex / base64 helpers

  # P2P (porting src/peer/*.js — PeerJS over WebRTC)
  flutter_webrtc: ^1.4.1         # Raw WebRTC (equivalent of browser RTCPeerConnection)
  web_socket_channel: ^3.0.1     # Signaling transport to PeerJS server

  # Storage (porting src/core/db.js, idbStore.js) — Drift over SQLite.
  # Drift gives typed queries + built-in isolate support, and sqlite3_flutter_libs
  # ships the native sqlite3 we need on Android/iOS/desktop.
  drift: ^2.20.0
  drift_flutter: ^0.2.2          # path_provider + sqlite3_flutter_libs wiring
  sqlite3_flutter_libs: ^0.5.24  # bundled sqlite3 binary for mobile/desktop
  path_provider: ^2.1.4

  # Vault KEK guardian — OS-level keychain / keystore with biometric gating.
  # v10+ introduces the enforceBiometrics / biometryCurrentSet flags we rely on.
  flutter_secure_storage: ^10.0.0-beta.4

  # Plain key/value prefs (porting src/peer/multiTabLock.js and friends). On
  # web this layers on localStorage; on Android/iOS/desktop on native backed
  # files. Used for the multi-tab lock and any non-secret "was the user here
  # before" flags that don't belong in the encrypted Drift DB.
  shared_preferences: ^2.3.3

  # State management (Phase 11 UI shell onwards). Mirrors the React app's
  # Context + hooks layering (see research/09_State management.md). We start
  # on plain Provider / StateNotifierProvider APIs; @riverpod codegen can be
  # layered on later without breaking existing providers.
  flutter_riverpod: ^2.5.1

  # Day 4 — voice messages + file attachments (porting src/components/
  # VoiceRecorder.jsx, VoicePlayer.jsx, AttachmentBubble.jsx and the
  # paperclip picker in Chats.jsx).
  #
  # `record` (audio recording) is back: the historical transitive-version
  # drift (record_platform_interface ↔ record_linux ↔ record_web ↔ …) is
  # resolved on the current 6.2.x line — `record: ^6.2.1` co-resolves a
  # consistent platform set (android/ios/linux/macos/web/windows). The
  # recorder records WAV (universal playback + honest PCM waveform) and the
  # live recorder UI lives in `voice_recorder_sheet.dart`. See `record:` below.
  #
  # `just_audio` plays the inbound blob — it can swap sources on the fly
  # which we need for "load bytes from Drift, hand to a Uri-less source".
  # `file_picker` is the native file sheet. `mime` infers content-type
  # from filename when the picker doesn't give one. `image` resizes
  # full-res photos down to the ≤48 KiB JPEG thumbnail.
  just_audio: ^0.9.42
  file_picker: ^8.1.4
  mime: ^2.0.0
  image: ^4.3.0

  # Day-5 / launch-blocker packages — QR display, QR scanning.
  # Theme typefaces are bundled under fonts/ (see flutter: fonts:) so the
  # client never fetches from fonts.googleapis.com / fonts.gstatic.com.

  # `qr_flutter` renders the user's peerId as a scannable QR code on the
  # "Show my QR" screen. Pure-Dart, no native deps.
  qr_flutter: ^4.1.0

  # `mobile_scanner` is the live camera-feed QR reader. Modern replacement
  # for the deprecated `qr_code_scanner` (which has unmaintained native
  # deps and breaks under Android 16 KB page alignment). v6 ships with
  # 16-KB-aligned native libs, which we need for Play Store submission.
  mobile_scanner: ^6.0.2

  # Liquid Glass redesign (2026-05) — declarative micro-animations.
  # `flutter_animate` (gskinner, Flutter Favorite) drives press feedback,
  # message-bubble entrance, sheet/content fades without controllers.
  # `animations` (flutter.dev) provides shared-axis / fade-through page
  # transitions. No glass/shader package — all blur is built-in BackdropFilter.
  flutter_animate: ^4.5.0
  animations: ^2.0.11

  # Windows-only: real Mica/acrylic at the OS window level so the in-app
  # fake-glass panels rest on a true translucent backdrop. No-op / guarded
  # off-Windows; the Dart call is gated by platform in main.dart.
  flutter_acrylic: ^1.1.0

  # Audio capture for voice messages (see the note in the voice block above).
  record: ^6.2.1

  # Per-read biometric gate (Face ID / Touch ID / fingerprint) in front of the
  # hardware-backed vault KEK. flutter_secure_storage v10 dropped its built-in
  # prompt, so we reintroduce it explicitly. Mobile-only at runtime — guarded
  # by `SecureKekVault.isSupported` (web/desktop never invoke it).
  local_auth: ^2.3.0

  # HKDF-SHA256 (HMAC) for the SQLCipher DB-key derivation in
  # storage/database.dart. Tiny, pure-Dart, web-safe.
  crypto: ^3.0.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1

  # Federated Bare/Hyperswarm transport plugin. Default live path stays
  # PeerJS; this package is the native-internal boundary when rollout
  # permits it.
  orbits_transport:
    path: packages/orbits_transport

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift codegen (tables.dart → tables.g.dart, database.dart → database.g.dart)
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

  # Native launcher-icon generation (Android mipmaps + adaptive icon, Windows
  # app_icon.ico) from the single source tool/branding/orbits_icon_source.png.
  # Config lives in flutter_launcher_icons.yaml; CI runs it after checkout
  # (android/ + windows/ are committed). Web icons are hand-managed under
  # web/ and intentionally NOT generated here.
  flutter_launcher_icons: ^0.14.1

  # Parse flutter_launcher_icons.yaml in launcher_icons_config_test.dart so a
  # regression in the icon config fails `flutter test` early.
  yaml: ^3.1.2

flutter:
  uses-material-design: true
  assets:
    - tool/connectivity_harness/BUNDLE.manifest
    - tool/connectivity_harness/src/worklet.js
    - tool/connectivity_harness/src/mux.js
    - tool/connectivity_harness/src/discovery.js
    - tool/connectivity_harness/src/loopback.js
    - tool/connectivity_harness/src/ipc.js
    - tool/connectivity_harness/src/swarm.js
    - tool/connectivity_harness/src/stand.js
    - tool/connectivity_harness/src/corestore_journal.js
    - tool/connectivity_harness/src/bare_compat.js
    - tool/bare/pins.json
    - tool/bare/BARE.manifest

  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Variable.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Variable.ttf
    - family: CormorantGaramond
      fonts:
        - asset: fonts/CormorantGaramond-Variable.ttf
    - family: NotoSerif
      fonts:
        - asset: fonts/NotoSerif-Variable.ttf
    - family: InstrumentSerif
      fonts:
        - asset: fonts/InstrumentSerif-Regular.ttf
          weight: 400
    - family: Geist
      fonts:
        - asset: fonts/Geist-Regular.ttf
          weight: 400
        - asset: fonts/Geist-SemiBold.ttf
          weight: 600
