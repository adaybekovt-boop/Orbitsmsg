name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: flutter pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # TURN/PeerJS config from repo secrets + variables (empty-safe — unset →
      # "" → app reads null → public PeerJS + STUN fallback).
      - name: Compose --dart-define flags (TURN / PeerJS)
        env:
          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_URLS: ${{ secrets.TURN_URLS }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          RELAY_ONLY: ${{ vars.RELAY_ONLY }}
          PEER_SERVER: ${{ vars.PEER_SERVER }}
          PEER_HOST: ${{ vars.PEER_HOST }}
          PEER_PATH: ${{ vars.PEER_PATH }}
          PEER_PORT: ${{ vars.PEER_PORT }}
          PEER_SECURE: ${{ vars.PEER_SECURE }}
        run: |
          echo "DART_DEFINES=--dart-define=TURN_URL=${TURN_URL} --dart-define=TURN_URLS=${TURN_URLS} --dart-define=TURN_USERNAME=${TURN_USERNAME} --dart-define=TURN_CREDENTIAL=${TURN_CREDENTIAL} --dart-define=RELAY_ONLY=${RELAY_ONLY:-false} --dart-define=PEER_SERVER=${PEER_SERVER} --dart-define=PEER_HOST=${PEER_HOST} --dart-define=PEER_PATH=${PEER_PATH:-/} --dart-define=PEER_PORT=${PEER_PORT:--1} --dart-define=PEER_SECURE=${PEER_SECURE} --dart-define=PEER_SECURE_SET=${PEER_SECURE:+true}" >> "$GITHUB_ENV"

      - name: Build web for GitHub Pages
        run: flutter build web --release --base-href /tkmessenger/ --pwa-strategy none $DART_DEFINES

      - name: Restore self-unregistering SW tombstones
        # `--pwa-strategy none` makes Flutter emit an EMPTY flutter_service_worker.js,
        # which clobbers our committed tombstone. Restore it so any browser that
        # still has the old Flutter PWA SW registered fetches the self-unregister
        # + cache-clear tombstone instead of a no-op empty file. (web/sw.js — the
        # legacy React/Vite PWA SW name — is preserved by the build untouched.)
        run: cp web/flutter_service_worker.js build/web/flutter_service_worker.js

      - name: Verify static assets
        run: |
          test -f build/web/index.html
          test -f build/web/sqlite3.wasm
          test -f build/web/drift_worker.js
          test -s build/web/sw.js
          test -s build/web/flutter_service_worker.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
