name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Pin Flutter once so all jobs agree.
#
# 3.32.0 (stable, May 2025) is the first Flutter release whose
# `flutter create` android template ships with Kotlin Gradle plugin
# 2.1.x and AGP 8.7.x out of the box. Earlier 3.27.x stuck at Kotlin
# 1.8.22, which mobile_scanner ^6 refuses to compile against.
env:
  FLUTTER_VERSION: '3.32.0'
  FLUTTER_CHANNEL: 'stable'
  PROJECT_NAME: 'orbits_flutter'
  PROJECT_ORG: 'com.orbits'

# Allow only one in-flight run per ref. Cancels the previous build when you
# push again — keeps the queue short and runner minutes low.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Lint + tests. Non-fatal: we still ship even if analyze warns, because
  # the project is mid-migration and `flutter_lints` flags pre-existing
  # noise we haven't cleaned up yet. The build jobs depend on this so the
  # report is at least produced.
  # ────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Codegen failures now fail the job — a missing `database.g.dart`
      # cascades into a confusing "Type _$OrbitsDatabase not found" wall
      # downstream, much harder to read than the real codegen error.
      - name: Generate code (drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Hard-fail on Dart compile errors (the analyzer treats those as
      # `error` severity even with --no-fatal-infos --no-fatal-warnings).
      # Without this gate a typo or wrong-version API call sails past
      # analyze and we only find out 6+ minutes later when `flutter build
      # apk` falls over on the kernel compile, with no actionable log
      # surfaced in the GitHub UI. Warnings/infos still don't block —
      # the project is mid-migration and has plenty of pre-existing
      # noise that's tracked separately.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Test failures now also fail the job; the crypto roundtrip suite
      # is pure-Dart and stable, so any red here is a real regression.
      - name: flutter test
        run: flutter test --reporter expanded

  # ────────────────────────────────────────────────────────────────────
  # Android. The platform folders aren't checked in — we generate them
  # fresh on every CI run so a checkout of just `lib/` + `pubspec.yaml`
  # builds. Then we patch:
  #   • AndroidManifest.xml — INTERNET, CAMERA, RECORD_AUDIO permissions
  #     for WebRTC, mobile_scanner and `record`.
  #   • build.gradle — point release `signingConfig` at the debug keystore
  #     so `flutter build apk --release` produces a sideloadable APK
  #     without a real upload key. Cannot ship to Play Store like this,
  #     but it installs and updates fine on any device.
  #
  # The debug keystore lives in actions/cache so the signature stays
  # stable across runs (otherwise updates would require uninstall first).
  # ────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Make sure SDK platform 36 + matching build-tools/NDK are present on
      # the runner. ubuntu-latest ships 33/34 by default; mobile_scanner 6
      # and current Android plugins require compileSdk 36 + NDK 27.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.0.12077973'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storetype PKCS12 \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: flutter pub get
        run: flutter pub get

      # windows/ is scaffolded here too (this job only builds the APK) so the
      # ONE shared flutter_launcher_icons.yaml — which covers BOTH Android and
      # Windows — runs without erroring on a missing windows/ folder. The
      # unused windows/ folder is ignored by `flutter build apk`.
      - name: Generate android/ + windows/ + web/ platforms
        run: |
          flutter create \
            --platforms=android,web,windows \
            --org="$PROJECT_ORG" \
            --project-name="$PROJECT_NAME" \
            .

      # Brand the freshly-created project with the Orbits launcher icon. flutter
      # create writes the default Flutter logo; flutter_launcher_icons replaces
      # it (legacy mipmaps + adaptive foreground/background) from the single
      # source of truth, tool/branding/orbits_icon_source.png. The verify block
      # fails the job if generation didn't run, so the APK can never ship with
      # the stock Flutter icon.
      - name: Generate & verify Orbits launcher icons (Android)
        run: |
          set -euo pipefail
          res=android/app/src/main/res
          before="$(sha256sum "$res/mipmap-hdpi/ic_launcher.png" 2>/dev/null | awk '{print $1}' || true)"

          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

          # Adaptive icon descriptor + its foreground/background wiring…
          test -f "$res/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q ic_launcher_foreground "$res/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q ic_launcher_background "$res/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q ic_launcher_background "$res/values/colors.xml"
          # …legacy + adaptive-foreground bitmaps for every density…
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$res/mipmap-$d/ic_launcher.png"
            test -s "$res/drawable-$d/ic_launcher_foreground.png"
          done
          # …and the legacy icon must DIFFER from the flutter-create default,
          # proving flutter_launcher_icons actually ran (not the stock logo).
          after="$(sha256sum "$res/mipmap-hdpi/ic_launcher.png" | awk '{print $1}')"
          if [ -n "$before" ] && [ "$before" = "$after" ]; then
            echo "::error::Android launcher icon is still the flutter-create default — flutter_launcher_icons did not run"
            exit 1
          fi
          echo "Android launcher icons generated from tool/branding/orbits_icon_source.png"

      - name: Patch AndroidManifest + signing config
        run: |
          sed -i 's/\r$//' tool/ci/patch_android.sh
          bash tool/ci/patch_android.sh

      # Drift / build_runner codegen MUST succeed for the app to compile
      # (lib/storage/* depends on the generated *.g.dart files). Keeping
      # this fatal so a codegen regression fails the job clearly rather
      # than cascading into a confusing "Type X not found" cascade later.
      - name: Generate code (drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # TURN/PeerJS config from repo secrets + variables. All empty-safe:
      # an unset secret/var becomes "" → the app reads it as null (see
      # peer_connection_provider.dart) and falls back to public PeerJS + STUN.
      - name: Compose --dart-define flags (TURN / PeerJS)
        env:
          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          RELAY_ONLY: ${{ vars.RELAY_ONLY }}
          PEER_SERVER: ${{ vars.PEER_SERVER }}
          PEER_HOST: ${{ vars.PEER_HOST }}
          PEER_PATH: ${{ vars.PEER_PATH }}
          PEER_PORT: ${{ vars.PEER_PORT }}
          PEER_SECURE: ${{ vars.PEER_SECURE }}
        run: |
          echo "DART_DEFINES=--dart-define=TURN_URL=${TURN_URL} --dart-define=TURN_USERNAME=${TURN_USERNAME} --dart-define=TURN_CREDENTIAL=${TURN_CREDENTIAL} --dart-define=RELAY_ONLY=${RELAY_ONLY:-false} --dart-define=PEER_SERVER=${PEER_SERVER} --dart-define=PEER_HOST=${PEER_HOST} --dart-define=PEER_PATH=${PEER_PATH:-/} --dart-define=PEER_PORT=${PEER_PORT:--1} --dart-define=PEER_SECURE=${PEER_SECURE} --dart-define=PEER_SECURE_SET=${PEER_SECURE:+true}" >> "$GITHUB_ENV"

      - name: flutter build apk (split per ABI)
        run: flutter build apk --release --split-per-abi $DART_DEFINES

      - name: flutter build apk (universal fallback)
        run: flutter build apk --release $DART_DEFINES

      - name: Stage APKs for upload
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk            dist/orbits-android-universal.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  dist/orbits-android-arm64.apk     || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/orbits-android-arm32.apk    || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk     dist/orbits-android-x86_64.apk    || true
          ls -lah dist/

      - uses: actions/upload-artifact@v4
        with:
          name: orbits-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────
  # Web. Static-site bundle, ship as a zip artifact. Two base-href
  # variants are produced:
  #   • orbits-web-relative.zip — `./` base-href, drop into any static
  #     host or open with file:// for local testing.
  #   • orbits-web-pages.zip    — `/tkmessenger/` base-href, ready for
  #     GitHub Pages at https://<owner>.github.io/tkmessenger/.
  # No GitHub Pages auto-deploy here — there's a separate pages.yml
  # workflow that handles publishing if/when the user wires it up.
  # ────────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web (Static)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: flutter pub get
        run: flutter pub get

      - name: Generate web/ platform
        run: |
          flutter create \
            --platforms=web \
            --org="$PROJECT_ORG" \
            --project-name="$PROJECT_NAME" \
            .

      - name: Generate code (drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Two bundles, two base-href flavors:
      #
      #   • relative (./)   — for static hosts that aren't at the domain
      #     root, and for `file://` previews. `flutter build web` itself
      #     refuses `--base-href "./"` ("should start and end with /"),
      #     so we build with `/` and post-process index.html to swap
      #     `<base href="/">` → `<base href="./">`. Same trick the
      #     Flutter team's own `flutter_tools/build/web` example uses.
      #
      #   • Pages (/tkmessenger/) — built directly, no rewriting needed.
      - name: Compose --dart-define flags (TURN / PeerJS)
        env:
          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          RELAY_ONLY: ${{ vars.RELAY_ONLY }}
          PEER_SERVER: ${{ vars.PEER_SERVER }}
          PEER_HOST: ${{ vars.PEER_HOST }}
          PEER_PATH: ${{ vars.PEER_PATH }}
          PEER_PORT: ${{ vars.PEER_PORT }}
          PEER_SECURE: ${{ vars.PEER_SECURE }}
        run: |
          echo "DART_DEFINES=--dart-define=TURN_URL=${TURN_URL} --dart-define=TURN_USERNAME=${TURN_USERNAME} --dart-define=TURN_CREDENTIAL=${TURN_CREDENTIAL} --dart-define=RELAY_ONLY=${RELAY_ONLY:-false} --dart-define=PEER_SERVER=${PEER_SERVER} --dart-define=PEER_HOST=${PEER_HOST} --dart-define=PEER_PATH=${PEER_PATH:-/} --dart-define=PEER_PORT=${PEER_PORT:--1} --dart-define=PEER_SECURE=${PEER_SECURE} --dart-define=PEER_SECURE_SET=${PEER_SECURE:+true}" >> "$GITHUB_ENV"

      - name: flutter build web (relative base-href)
        run: |
          flutter build web --release --base-href "/" --pwa-strategy none $DART_DEFINES
          # rewrite to relative ./ for static-host / file:// previews
          sed -i 's|<base href="/">|<base href="./">|' build/web/index.html

      # The hand-tuned web/PWA/Safari icons are copied verbatim by `flutter build
      # web`; fail loudly if any referenced file went missing from the bundle.
      - name: Verify branding icons survive into build/web
        run: |
          set -euo pipefail
          test -s build/web/favicon.png
          test -s build/web/apple-touch-icon.png
          test -s build/web/manifest.json
          for i in Icon-192 Icon-512 Icon-maskable-192 Icon-maskable-512; do
            test -s "build/web/icons/$i.png"
          done
          echo "web branding icons present in build/web"

      - name: Stage relative-base bundle
        run: |
          mkdir -p dist
          cp -r build/web dist/orbits-web-relative
          (cd dist && zip -qr orbits-web-relative.zip orbits-web-relative)

      - name: flutter build web (Pages base-href)
        run: flutter build web --release --base-href "/tkmessenger/" --pwa-strategy none $DART_DEFINES

      - name: Stage Pages bundle
        run: |
          # `--pwa-strategy none` emits an empty flutter_service_worker.js;
          # restore the self-unregistering tombstone so old Flutter-PWA clients
          # self-clean (web/sw.js — the legacy React SW name — is left intact).
          cp web/flutter_service_worker.js build/web/flutter_service_worker.js
          cp -r build/web dist/orbits-web-pages
          (cd dist && zip -qr orbits-web-pages.zip orbits-web-pages)
          ls -lah dist/

      - uses: actions/upload-artifact@v4
        with:
          name: orbits-web
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────
  # Windows. Flutter's raw `Release/` folder contains an exe plus DLLs and
  # data files, so shipping only that runner exe would not start on a user's
  # machine. We wrap the full folder into a single Inno Setup installer exe
  # and upload that one file for website "Download for Windows" buttons.
  # ────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (EXE)
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable windows desktop
        run: flutter config --enable-windows-desktop

      - name: flutter pub get
        run: flutter pub get

      # android/ is scaffolded here too (this job only builds the EXE) so the
      # ONE shared flutter_launcher_icons.yaml — which covers BOTH Android and
      # Windows — runs without erroring on a missing android/ folder. The
      # unused android/ folder is ignored by `flutter build windows`.
      - name: Generate windows/ + android/ + web/ platforms
        shell: bash
        run: |
          flutter create \
            --platforms=windows,web,android \
            --org="$PROJECT_ORG" \
            --project-name="$PROJECT_NAME" \
            .

      # Brand the EXE icon BEFORE `flutter build windows`. The Orbits app_icon.ico
      # is force-tracked, and `flutter create` keeps it; flutter_launcher_icons
      # regenerates it from the single source anyway. windows/runner/Runner.rc
      # compiles it into the runner EXE (window + taskbar + EXE + installer all
      # use it). The verify fails the job if the icon is the default Flutter logo,
      # regardless of whether `flutter create` overwrote or kept it.
      - name: Generate & verify Orbits launcher icon (Windows)
        shell: bash
        run: |
          set -euo pipefail
          ico=windows/runner/resources/app_icon.ico

          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

          test -s "$ico"
          hash="$(sha256sum "$ico" | awk '{print $1}')"
          # Fail if the EXE would carry the default Flutter icon (the blue logo).
          while IFS= read -r d; do
            case "$d" in ''|\#*) continue ;; esac
            if [ "$hash" = "$d" ]; then
              echo "::error::windows/runner/resources/app_icon.ico is the default Flutter icon — flutter_launcher_icons did not produce the Orbits icon"
              exit 1
            fi
          done < tool/windows/flutter_default_app_icon.sha256
          echo "Windows app_icon.ico is the Orbits icon ($hash)"

      # Codegen MUST succeed here too — lib/storage/* depends on the
      # generated *.g.dart files, so a silent codegen failure would only
      # surface later as a confusing "Type X not found" wall during the
      # windows kernel compile. Kept fatal, matching the android/web jobs.
      - name: Generate code (drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter build windows (release)
        env:
          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          RELAY_ONLY: ${{ vars.RELAY_ONLY }}
          PEER_SERVER: ${{ vars.PEER_SERVER }}
          PEER_HOST: ${{ vars.PEER_HOST }}
          PEER_PATH: ${{ vars.PEER_PATH }}
          PEER_PORT: ${{ vars.PEER_PORT }}
          PEER_SECURE: ${{ vars.PEER_SECURE }}
        shell: pwsh
        run: |
          # Empty env → empty --dart-define value → app reads null (public PeerJS).
          $defines = @(
            "--dart-define=TURN_URL=$env:TURN_URL",
            "--dart-define=TURN_USERNAME=$env:TURN_USERNAME",
            "--dart-define=TURN_CREDENTIAL=$env:TURN_CREDENTIAL",
            "--dart-define=RELAY_ONLY=$(if ($env:RELAY_ONLY) { $env:RELAY_ONLY } else { 'false' })",
            "--dart-define=PEER_SERVER=$env:PEER_SERVER",
            "--dart-define=PEER_HOST=$env:PEER_HOST",
            "--dart-define=PEER_PATH=$(if ($env:PEER_PATH) { $env:PEER_PATH } else { '/' })",
            "--dart-define=PEER_PORT=$(if ($env:PEER_PORT) { $env:PEER_PORT } else { '-1' })",
            "--dart-define=PEER_SECURE=$env:PEER_SECURE",
            "--dart-define=PEER_SECURE_SET=$(if ($env:PEER_SECURE) { 'true' } else { 'false' })"
          )
          flutter build windows --release @defines

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Bundle VC++ Redistributable runtime DLLs
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          $redist = Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $redist) {
            $redist = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          }
          if ($redist) {
            $src = Join-Path $redist.FullName "x64\Microsoft.VC143.CRT"
            if (Test-Path $src) {
              Copy-Item "$src\*.dll" $rel -Force
              Write-Host "Copied VC runtime from $src"
            }
          } else {
            Write-Host "VC redist folder not found — relying on what flutter ships."
          }
          Get-ChildItem $rel | Format-Table Name, Length

      - name: Build single-file Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            $version = "0.1.0"
          }
          $iss = @"
          #define MyAppName "Orbits"
          #define MyAppVersion "$version"
          #define MyAppExeName "orbits_flutter.exe"

          [Setup]
          AppId={{D47395D5-16CC-4ED3-98DF-0E611CC58F96}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          DefaultDirName={autopf}\Orbits
          DefaultGroupName=Orbits
          DisableProgramGroupPage=yes
          OutputDir=dist
          OutputBaseFilename=orbits-windows-x64
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          WizardStyle=modern
          ; Branding: the Orbits icon on the installer wizard EXE and in
          ; Add/Remove Programs. SetupIconFile is relative to this .iss (repo
          ; root); the app_icon.ico is the one flutter_launcher_icons generated.
          SetupIconFile=windows\runner\resources\app_icon.ico
          UninstallDisplayIcon={app}\{#MyAppExeName}

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          ; Shortcuts draw their glyph from the app EXE (which embeds app_icon.ico
          ; via Runner.rc) — set IconFilename explicitly so it's unambiguous.
          Name: "{group}\Orbits"; Filename: "{app}\{#MyAppExeName}"; IconFilename: "{app}\{#MyAppExeName}"
          Name: "{commondesktop}\Orbits"; Filename: "{app}\{#MyAppExeName}"; IconFilename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch Orbits"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          & $iscc installer.iss
          if (-not (Test-Path dist\orbits-windows-x64.exe)) {
            throw "Windows installer was not created"
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: orbits-windows
          path: dist/orbits-windows-x64.exe
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────
  # On a tag like `v0.1.0`, gather artifacts from every platform build
  # and attach them to a GitHub Release.
  # ────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-web, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: ls -R artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/orbits-android/*.apk
            artifacts/orbits-windows/*.exe
          body: |
            ## What's new

            - Servers are now created only in the desktop app (Windows, macOS, Linux). The web version can still join servers, but it no longer creates them — so you won't end up with a "server" that has nowhere to actually run.
            - On Windows, if a server can't start, Orbits now tells you exactly why — for example a blocked port, a firewall, or no local network — instead of quietly pretending it worked.
            - "Remember me" now works on Windows: tick it when you sign in and Orbits can reopen without asking for your password. The key is kept in Windows' own secure storage, and your password is never saved.
            - The Windows app, its installer, and the desktop and Start-menu shortcuts now show the Orbits icon instead of the default placeholder.
            - The encryption core was not rewritten; this update is about where servers can be created, clearer error messages, easier sign-in on Windows, and correct branding.

            ## Что нового

            - Серверы теперь создаются только в настольном приложении (Windows, macOS, Linux). Веб-версия по-прежнему может подключаться к серверам, но больше не создаёт их — чтобы не появлялся «сервер», которому негде работать.
            - На Windows, если сервер не удаётся запустить, Orbits теперь честно показывает причину — например, занятый порт, брандмауэр или отсутствие локальной сети — а не делает вид, что всё получилось.
            - На Windows заработала галочка «Запомнить меня»: отметьте её при входе, и Orbits сможет открываться без пароля. Ключ хранится в защищённом хранилище Windows, а сам пароль никогда не сохраняется.
            - Приложение для Windows, его установщик и ярлыки (на рабочем столе и в меню «Пуск») теперь показывают значок Orbits вместо стандартной заглушки.
            - Криптоядро не переписывалось; обновление про то, где можно создавать серверы, понятные сообщения об ошибках, удобный вход на Windows и правильный значок.

