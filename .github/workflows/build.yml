name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  # No branches: filter. Stacked Phase PRs target the previous phase
  # branch, not main. GitHub evaluates pull_request triggers from the
  # *base* branch, so this must be open on Phase 0 or later stacked PRs
  # never get CI.
  pull_request:
  workflow_dispatch:

# Least privilege by default (U-3). The release job opts into contents:write.
permissions:
  contents: read

# Pin Flutter once so all jobs agree.
#
# 3.44.7 is the project baseline validated for Xcode 26 / iOS 26 SDK uploads.
# Keep this in sync with .flutter-version, .fvmrc, and pubspec.yaml.
env:
  FLUTTER_VERSION: '3.44.7'
  FLUTTER_CHANNEL: 'stable'
  PROJECT_NAME: 'orbits_flutter'
  PROJECT_ORG: 'com.orbits'

# Allow only one in-flight run per ref. Cancels the previous build when you
# push again — keeps the queue short and runner minutes low.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Lint + tests. Analyzer warnings are fatal. Infos stay
  # non-blocking so generated Drift noise doesn't fail the gate.
  # ────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Pinned SDK matches toolchain manifest
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .flutter-version)"
          if [ "$pinned" != "$FLUTTER_VERSION" ]; then
            echo "::error::.flutter-version ($pinned) != FLUTTER_VERSION ($FLUTTER_VERSION)"
            exit 1
          fi

      # Codegen failures now fail the job — a missing `database.g.dart`
      # cascades into a confusing "Type _$OrbitsDatabase not found" wall
      # downstream, much harder to read than the real codegen error.
      - name: Generate code (drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Warnings block merge. Infos (mostly generated Drift) do not.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      # Test failures now also fail the job; the crypto roundtrip suite
      # is pure-Dart and stable, so any red here is a real regression.
      - name: flutter test
        run: flutter test --reporter expanded

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Connectivity harness (loopback, no hardware)
        working-directory: tool/connectivity_harness
        run: |
          npm ci --omit=dev --no-fund --no-audit
          node --test --test-force-exit test/*.test.js

      - name: Local mailbox, fleet, and opaque wake (not public)
        run: |
          node --test tool/storage_peer/test.js
          node --test tool/fleet/test.js
          node --test tool/push_gateway/test.js

      - name: Pin worklet bundle hash (no remote JS)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          worklet = Path("tool/connectivity_harness/src/worklet.js").read_bytes()
          digest = hashlib.sha256(worklet).hexdigest()
          manifest = json.loads(Path("tool/connectivity_harness/BUNDLE.manifest").read_text())
          if manifest.get("remoteJs") is not False:
              raise SystemExit("BUNDLE.manifest must set remoteJs=false")
          pinned = manifest.get("workletSha256")
          if pinned != digest:
              raise SystemExit(f"worklet hash {digest} != pinned {pinned}")
          pkg = Path("tool/connectivity_harness/package.json").read_bytes()
          pkg_digest = hashlib.sha256(pkg).hexdigest()
          pkg_pin = manifest.get("packageJsonSha256")
          if pkg_pin != pkg_digest:
              raise SystemExit(f"package.json hash {pkg_digest} != pinned {pkg_pin}")
          print(f"worklet.js sha256={digest}")
          print(f"package.json sha256={pkg_digest}")
          PY

      - name: Pin Bare vendor tarball hashes (Dart never fetches)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("tool/bare/BARE.manifest").read_text())
          if manifest.get("remoteFetch") is not False:
              raise SystemExit("BARE.manifest must set remoteFetch=false")
          if manifest.get("downloadUrl") is not None or manifest.get("bundleUrl") is not None:
              raise SystemExit("BARE.manifest downloadUrl/bundleUrl must stay null")
          if manifest.get("shipped") is not False:
              raise SystemExit("BARE.manifest shipped must stay false until every OS slot is in the app bundle")
          slots = [
              "linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64",
              "windows-x64", "android-arm64", "ios-arm64",
          ]
          assets = (manifest.get("vendor") or {}).get("assets") or {}
          for slot in slots:
              asset = assets.get(slot) or {}
              digest = asset.get("sha256")
              if not isinstance(digest, str) or len(digest) != 64:
                  raise SystemExit(f"missing sha256 pin for {slot}")
          print("bare vendor hashes pinned for", ", ".join(slots))
          PY

      - name: Pin in-tree SBOM against worklet and Bare hashes
        run: python3 tool/sbom/generate.py --check

      - name: Transport plugin lifecycle
        working-directory: packages/orbits_transport
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  # ────────────────────────────────────────────────────────────────────
  # Native platform folders are committed and must not be regenerated with
  # `flutter create --overwrite`; that would clobber reviewed security files.
  # Icon generation runs in every native job.
  #
  #
  # ────────────────────────────────────────────────────────────────────
  # iOS. macOS 26 carries Xcode 26 and an iOS 26 SDK, which App Store
  # Connect requires for uploads after 2026-04-28. This verifies device-release
  # and simulator builds without requiring distribution signing secrets.
  build-ios:
    name: Build iOS (Xcode 26)
    needs: analyze
    runs-on: macos-26
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Select Xcode 26 and verify SDK
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          case "$sdk" in 26.*) ;; *) echo "::error::expected iOS 26 SDK, got $sdk"; exit 1 ;; esac

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies and generate Drift code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate and verify iOS assets
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          test -s ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          test -s ios/Runner/PrivacyInfo.xcprivacy
          grep -q NSFaceIDUsageDescription ios/Runner/Info.plist
          grep -q NSLocalNetworkUsageDescription ios/Runner/Info.plist

      - name: Build iOS release without signing
        env:
          TURN_URL: ${{ secrets.TURN_URL }}
          RELAY_ONLY: ${{ vars.RELAY_ONLY }}
          PEER_SERVER: ${{ vars.PEER_SERVER }}
          PEER_HOST: ${{ vars.PEER_HOST }}
          PEER_PATH: ${{ vars.PEER_PATH }}
          PEER_PORT: ${{ vars.PEER_PORT }}
          PEER_SECURE: ${{ vars.PEER_SECURE }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=TURN_URL="$TURN_URL" \
            --dart-define=RELAY_ONLY="${RELAY_ONLY:-false}" \
            --dart-define=PEER_SERVER="$PEER_SERVER" \
            --dart-define=PEER_HOST="$PEER_HOST" \
            --dart-define=PEER_PATH="${PEER_PATH:-/}" \
            --dart-define=PEER_PORT="${PEER_PORT:--1}" \
            --dart-define=PEER_SECURE="$PEER_SECURE" \
            --dart-define=PEER_SECURE_SET="${PEER_SECURE:+true}"
          test -d build/ios/iphoneos/Runner.app
          test -f build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy

      - name: Build iOS Simulator debug app
        run: flutter build ios --simulator --debug

  # Android release signing (GH-C01 / U-5) never uses the SDK debug key.
  # Tags/main use owner secrets; PRs use a cached CI sideload key.
  build-android:
    name: Build Android (APK)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      # Make sure SDK platform 36 + matching build-tools/NDK are present on
      # the runner. ubuntu-latest ships 33/34 by default; mobile_scanner 6
      # and current Android plugins require compileSdk 36 + NDK 27.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.0.12077973'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache CI sideload upload keystore
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/orbits-keystore/orbits-ci-upload.keystore
            ${{ runner.temp }}/orbits-keystore/orbits-ci-upload.keystore.pass
          key: android-upload-keystore-ci-v1

      - name: Prepare upload keystore (GH-C01 / U-5)
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ORBITS_KEYSTORE_DIR: ${{ runner.temp }}/orbits-keystore
        run: bash tool/ci/prepare_upload_keystore.sh

      - name: flutter pub get
        run: flutter pub get

      - name: Verify committed Android security configs
        run: |
          set -euo pipefail
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/xml/network_security_config.xml
          test -f android/app/src/main/res/xml/backup_rules.xml
          test -f android/app/src/main/res/xml/data_extraction_rules.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' android/app/src/main/AndroidManifest.xml
          test -f windows/runner/resources/app_icon.ico

      # Brand the freshly-created project with the Orbits launcher icon. flutter
      # create writes the default Flutter logo; flutter_launcher_icons replaces
      # it (legacy mipmaps + adaptive foreground/background) from the single
      # source of truth, tool/branding/orbits_icon_source.png. The verify block
      # fails the job if generation didn't run, so the APK can never ship with
      # the stock Flutter icon.
      - name: Generate & verify Orbits launcher icons (Android)
        run: |
          set -euo pipefail
          res=android/app/src/main/res

          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

          # Adaptive icon descriptor + its foreground/background wiring…
          test -f "$res/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q ic_launcher_foreground "$res/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q ic_launcher_background "$res/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q ic_launcher_background "$res/values/colors.xml"
          # …legacy + adaptive-foreground bitmaps for every density…
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$res/mipmap-$d/ic_launcher.png"
            test -s "$res/drawable-$d/ic_launcher_foreground.png"
          done
          # Committed Orbits icons are already the source of truth, so
          # regeneration is idempotent (before==after is expected). Fail only
          # if the bitmap still matches a known flutter-create default.
          after="$(sha256sum "$res/mipmap-hdpi/ic_launcher.png" | awk '{print $1}')"
          while IFS= read -r d; do
            case "$d" in ''|\#*) continue ;; esac
            if [ "$after" = "$d" ]; then
              echo "::error::Android launcher icon is the flutter-create default (blue logo)"
              exit 1
            fi
          done < tool/branding/flutter_default_android_hdpi.sha256
          echo "Android launcher icons generated from tool/branding/orbits_icon_source.png ($after)"

      - name: Patch AndroidManifest + signing config
        run: |
          sed -i 's/\r$//' tool/ci/patch_android.sh
          bash tool/ci/patch_android.sh

      # Drift / build_runner codegen MUST succeed for the app to compile
      # (lib/storage/* depends on the generated *.g.dart files). Keeping
      # this fatal so a codegen regression fails the job clearly rather
      # than cascading into a confusing "Type X not found" cascade later.
      - name: Generate code (drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # TURN URL (not a secret) + PeerJS config. Username/credential are
      # loaded at runtime — never baked via --dart-define into the APK.
      - name: Compose --dart-define flags (TURN URL / PeerJS)
        env:
          TURN_URL: ${{ secrets.TURN_URL }}
          RELAY_ONLY: ${{ vars.RELAY_ONLY }}
          PEER_SERVER: ${{ vars.PEER_SERVER }}
          PEER_HOST: ${{ vars.PEER_HOST }}
          PEER_PATH: ${{ vars.PEER_PATH }}
          PEER_PORT: ${{ vars.PEER_PORT }}
          PEER_SECURE: ${{ vars.PEER_SECURE }}
        run: |
          echo "DART_DEFINES=--dart-define=TURN_URL=${TURN_URL} --dart-define=RELAY_ONLY=${RELAY_ONLY:-false} --dart-define=PEER_SERVER=${PEER_SERVER} --dart-define=PEER_HOST=${PEER_HOST} --dart-define=PEER_PATH=${PEER_PATH:-/} --dart-define=PEER_PORT=${PEER_PORT:--1} --dart-define=PEER_SECURE=${PEER_SECURE} --dart-define=PEER_SECURE_SET=${PEER_SECURE:+true}" >> "$GITHUB_ENV"

      - name: flutter build apk (split per ABI)
        run: bash tool/ci/retry_flutter_apk.sh --release --split-per-abi $DART_DEFINES

      - name: flutter build apk (universal fallback)
        run: bash tool/ci/retry_flutter_apk.sh --release $DART_DEFINES

      - name: Stage APKs for upload
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk            dist/orbits-android-universal.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  dist/orbits-android-arm64.apk     || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/orbits-android-arm32.apk    || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk     dist/orbits-android-x86_64.apk    || true
          ls -lah dist/

      - name: Verify APKs are not debug-signed (GH-C01 / U-5)
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::no APKs in dist/ to verify"
            exit 1
          fi
          bash tool/ci/verify_apk_not_debug_signed.sh "${apks[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbits-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────
  # Web. Static-site bundle, ship as a zip artifact. Two base-href
  # variants are produced:
  #   • orbits-web-relative.zip — `./` base-href, drop into any static
  #     host or open with file:// for local testing.
  #   • orbits-web-pages.zip    — `/tkmessenger/` base-href, ready for
  #     GitHub Pages at https://<owner>.github.io/tkmessenger/.
  # No GitHub Pages auto-deploy here — there's a separate pages.yml
  # workflow that handles publishing if/when the user wires it up.
  # ────────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web (Static)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: flutter pub get
        run: flutter pub get

      - name: Verify committed web/ platform
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/drift_worker.js

      - name: Generate code (drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Two bundles, two base-href flavors:
      #
      #   • relative (./)   — for static hosts that aren't at the domain
      #     root, and for `file://` previews. `flutter build web` itself
      #     refuses `--base-href "./"` ("should start and end with /"),
      #     so we build with `/` and post-process index.html to swap
      #     `<base href="/">` → `<base href="./">`. Same trick the
      #     Flutter team's own `flutter_tools/build/web` example uses.
      #
      #   • Pages (/tkmessenger/) — built directly, no rewriting needed.
      - name: Compose --dart-define flags (TURN URL / PeerJS)
        env:
          TURN_URL: ${{ secrets.TURN_URL }}
          RELAY_ONLY: ${{ vars.RELAY_ONLY }}
          PEER_SERVER: ${{ vars.PEER_SERVER }}
          PEER_HOST: ${{ vars.PEER_HOST }}
          PEER_PATH: ${{ vars.PEER_PATH }}
          PEER_PORT: ${{ vars.PEER_PORT }}
          PEER_SECURE: ${{ vars.PEER_SECURE }}
        run: |
          echo "DART_DEFINES=--dart-define=TURN_URL=${TURN_URL} --dart-define=RELAY_ONLY=${RELAY_ONLY:-false} --dart-define=PEER_SERVER=${PEER_SERVER} --dart-define=PEER_HOST=${PEER_HOST} --dart-define=PEER_PATH=${PEER_PATH:-/} --dart-define=PEER_PORT=${PEER_PORT:--1} --dart-define=PEER_SECURE=${PEER_SECURE} --dart-define=PEER_SECURE_SET=${PEER_SECURE:+true}" >> "$GITHUB_ENV"

      - name: flutter build web (relative base-href)
        run: |
          flutter build web --release --base-href "/" --pwa-strategy none $DART_DEFINES
          # rewrite to relative ./ for static-host / file:// previews
          sed -i 's|<base href="/">|<base href="./">|' build/web/index.html

      # The hand-tuned web/PWA/Safari icons are copied verbatim by `flutter build
      # web`; fail loudly if any referenced file went missing from the bundle.
      - name: Verify branding icons survive into build/web
        run: |
          set -euo pipefail
          test -s build/web/favicon.png
          test -s build/web/apple-touch-icon.png
          test -s build/web/manifest.json
          for i in Icon-192 Icon-512 Icon-maskable-192 Icon-maskable-512; do
            test -s "build/web/icons/$i.png"
          done
          echo "web branding icons present in build/web"

      - name: Stage relative-base bundle
        run: |
          mkdir -p dist
          cp -r build/web dist/orbits-web-relative
          (cd dist && zip -qr orbits-web-relative.zip orbits-web-relative)

      - name: flutter build web (Pages base-href)
        run: flutter build web --release --base-href "/tkmessenger/" --pwa-strategy none $DART_DEFINES

      - name: Stage Pages bundle
        run: |
          # `--pwa-strategy none` emits an empty flutter_service_worker.js;
          # restore the self-unregistering tombstone so old Flutter-PWA clients
          # self-clean (web/sw.js — the legacy React SW name — is left intact).
          cp web/flutter_service_worker.js build/web/flutter_service_worker.js
          cp -r build/web dist/orbits-web-pages
          (cd dist && zip -qr orbits-web-pages.zip orbits-web-pages)
          ls -lah dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbits-web
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────
  # Windows. Flutter's raw `Release/` folder contains an exe plus DLLs and
  # data files, so shipping only that runner exe would not start on a user's
  # machine. We wrap the full folder into a single Inno Setup installer exe
  # and upload that one file for website "Download for Windows" buttons.
  # ────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (EXE)
    needs: analyze
    # Flutter 3.32.0 maps only VS major 17 → "Visual Studio 17 2022".
    # windows-latest (2025+) reports VS 18, which the SDK treats as
    # "Visual Studio 16 2019" — not installed — and cmake fails.
    # windows-2022 matches the pinned SDK and the VC redist paths below.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable windows desktop
        run: flutter config --enable-windows-desktop

      - name: flutter pub get
        run: flutter pub get

      - name: Verify committed Windows + Android platforms
        shell: bash
        run: |
          set -euo pipefail
          test -s windows/runner/resources/app_icon.ico
          test -f windows/CMakeLists.txt
          test -f windows/runner/main.cpp
          test -f android/app/src/main/AndroidManifest.xml
          test -f web/index.html

      # Brand the EXE icon BEFORE `flutter build windows`. The Orbits app_icon.ico
      # is force-tracked, and `flutter create` keeps it; flutter_launcher_icons
      # regenerates it from the single source anyway. windows/runner/Runner.rc
      # compiles it into the runner EXE (window + taskbar + EXE + installer all
      # use it). The verify fails the job if the icon is the default Flutter logo,
      # regardless of whether `flutter create` overwrote or kept it.
      - name: Generate & verify Orbits launcher icon (Windows)
        shell: bash
        run: |
          set -euo pipefail
          ico=windows/runner/resources/app_icon.ico

          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

          test -s "$ico"
          hash="$(sha256sum "$ico" | awk '{print $1}')"
          # Fail if the EXE would carry the default Flutter icon (the blue logo).
          while IFS= read -r d; do
            case "$d" in ''|\#*) continue ;; esac
            if [ "$hash" = "$d" ]; then
              echo "::error::windows/runner/resources/app_icon.ico is the default Flutter icon — flutter_launcher_icons did not produce the Orbits icon"
              exit 1
            fi
          done < tool/windows/flutter_default_app_icon.sha256
          echo "Windows app_icon.ico is the Orbits icon ($hash)"

      # Codegen MUST succeed here too — lib/storage/* depends on the
      # generated *.g.dart files, so a silent codegen failure would only
      # surface later as a confusing "Type X not found" wall during the
      # windows kernel compile. Kept fatal, matching the android/web jobs.
      - name: Generate code (drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter build windows (release)
        env:
          TURN_URL: ${{ secrets.TURN_URL }}
          RELAY_ONLY: ${{ vars.RELAY_ONLY }}
          PEER_SERVER: ${{ vars.PEER_SERVER }}
          PEER_HOST: ${{ vars.PEER_HOST }}
          PEER_PATH: ${{ vars.PEER_PATH }}
          PEER_PORT: ${{ vars.PEER_PORT }}
          PEER_SECURE: ${{ vars.PEER_SECURE }}
        shell: pwsh
        run: |
          # Empty env → empty --dart-define value → app reads null (public PeerJS).
          # TURN username/credential are runtime-only — never baked into the EXE.
          $defines = @(
            "--dart-define=TURN_URL=$env:TURN_URL",
            "--dart-define=RELAY_ONLY=$(if ($env:RELAY_ONLY) { $env:RELAY_ONLY } else { 'false' })",
            "--dart-define=PEER_SERVER=$env:PEER_SERVER",
            "--dart-define=PEER_HOST=$env:PEER_HOST",
            "--dart-define=PEER_PATH=$(if ($env:PEER_PATH) { $env:PEER_PATH } else { '/' })",
            "--dart-define=PEER_PORT=$(if ($env:PEER_PORT) { $env:PEER_PORT } else { '-1' })",
            "--dart-define=PEER_SECURE=$env:PEER_SECURE",
            "--dart-define=PEER_SECURE_SET=$(if ($env:PEER_SECURE) { 'true' } else { 'false' })"
          )
          flutter build windows --release @defines

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Bundle VC++ Redistributable runtime DLLs
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          $redist = Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $redist) {
            $redist = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          }
          if ($redist) {
            $src = Join-Path $redist.FullName "x64\Microsoft.VC143.CRT"
            if (Test-Path $src) {
              Copy-Item "$src\*.dll" $rel -Force
              Write-Host "Copied VC runtime from $src"
            }
          } else {
            Write-Host "VC redist folder not found — relying on what flutter ships."
          }
          Get-ChildItem $rel | Format-Table Name, Length

      - name: Build single-file Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            $version = "0.1.0"
          }
          $iss = @"
          #define MyAppName "Orbits"
          #define MyAppVersion "$version"
          #define MyAppExeName "orbits_flutter.exe"

          [Setup]
          AppId={{D47395D5-16CC-4ED3-98DF-0E611CC58F96}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          DefaultDirName={autopf}\Orbits
          DefaultGroupName=Orbits
          DisableProgramGroupPage=yes
          OutputDir=dist
          OutputBaseFilename=orbits-windows-x64
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          WizardStyle=modern
          ; Branding: the Orbits icon on the installer wizard EXE and in
          ; Add/Remove Programs. SetupIconFile is relative to this .iss (repo
          ; root); the app_icon.ico is the one flutter_launcher_icons generated.
          SetupIconFile=windows\runner\resources\app_icon.ico
          UninstallDisplayIcon={app}\{#MyAppExeName}

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          ; Shortcuts draw their glyph from the app EXE (which embeds app_icon.ico
          ; via Runner.rc) — set IconFilename explicitly so it's unambiguous.
          Name: "{group}\Orbits"; Filename: "{app}\{#MyAppExeName}"; IconFilename: "{app}\{#MyAppExeName}"
          Name: "{commondesktop}\Orbits"; Filename: "{app}\{#MyAppExeName}"; IconFilename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch Orbits"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          & $iscc installer.iss
          if (-not (Test-Path dist\orbits-windows-x64.exe)) {
            throw "Windows installer was not created"
          }
          Get-ChildItem dist

      # A.1: actually invoke signtool when a PFX secret exists. Tags without
      # a cert fail closed (unsigned release EXEs are not shippable).
      - name: Authenticode-sign Windows installer (U-1 / A.1)
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
        run: bash tool/ci/sign_windows_exe.sh dist/orbits-windows-x64.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbits-windows
          path: dist/orbits-windows-x64.exe
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────
  # On a tag like `v0.1.0`, gather artifacts from every platform build
  # and attach them to a GitHub Release.
  # ────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-web, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Show artifacts
        run: ls -R artifacts

      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            artifacts/orbits-android/*.apk
            artifacts/orbits-windows/*.exe
          body: |
            ## What's new

            - Servers are now created only in the desktop app (Windows, macOS, Linux). The web version can still join servers, but it no longer creates them — so you won't end up with a "server" that has nowhere to actually run.
            - On Windows, if a server can't start, Orbits now tells you exactly why — for example a blocked port, a firewall, or no local network — instead of quietly pretending it worked.
            - "Remember me" now works on Windows: tick it when you sign in and Orbits can reopen without asking for your password. The key is kept in Windows' own secure storage, and your password is never saved.
            - The Windows app, its installer, and the desktop and Start-menu shortcuts now show the Orbits icon instead of the default placeholder.
            - The encryption core was not rewritten; this update is about where servers can be created, clearer error messages, easier sign-in on Windows, and correct branding.

            ## Что нового

            - Серверы теперь создаются только в настольном приложении (Windows, macOS, Linux). Веб-версия по-прежнему может подключаться к серверам, но больше не создаёт их — чтобы не появлялся «сервер», которому негде работать.
            - На Windows, если сервер не удаётся запустить, Orbits теперь честно показывает причину — например, занятый порт, брандмауэр или отсутствие локальной сети — а не делает вид, что всё получилось.
            - На Windows заработала галочка «Запомнить меня»: отметьте её при входе, и Orbits сможет открываться без пароля. Ключ хранится в защищённом хранилище Windows, а сам пароль никогда не сохраняется.
            - Приложение для Windows, его установщик и ярлыки (на рабочем столе и в меню «Пуск») теперь показывают значок Orbits вместо стандартной заглушки.
            - Криптоядро не переписывалось; обновление про то, где можно создавать серверы, понятные сообщения об ошибках, удобный вход на Windows и правильный значок.

            ## Download links / Ссылки

            - Windows EXE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/orbits-windows-x64.exe
            - Android APK: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/orbits-android-universal.apk
            - Flutter Web: https://adaybekovt-boop.github.io/tkmessenger/
          draft: false
          prerelease: false

      - name: Smoke-check releases/latest points at this tag
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"
          url="https://github.com/${repo}/releases/latest"
          for i in 1 2 3 4 5 6; do
            loc="$(curl -fsSI -o /dev/null -w '%{redirect_url}' "$url" || true)"
            echo "latest -> ${loc:-<empty>}"
            if [[ "$loc" == *"/releases/tag/${tag}" ]]; then
              exit 0
            fi
            sleep $((i * 2))
          done
          echo "::error::releases/latest did not resolve to tag ${tag}"
          exit 1
