# Pin GitHub Actions to full commit SHAs (U-3). Least-privilege
# contents:read. Secret scanning (Gitleaks) + basic SAST (Semgrep).
name: Security scans

on:
  push:
    branches: [main, master]
  # No branches: filter — same reason as build.yml (stacked Phase PRs).
  pull_request:
  schedule:
    # Weekly catch-up if a PR slipped through without a scan.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Official action; public repos do not need GITLEAKS_LICENSE.
      # Config: repo-root .gitleaks.toml (extends default). Scheduled
      # runs scan full history; local preference key names are allowlisted.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: python3 -m pip install --user 'semgrep==1.110.0'

      - name: Semgrep scan
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --metrics=off \
            --exclude=.git \
            --exclude=build \
            --exclude=.dart_tool \
            --exclude=.fvm

  license-sbom:
    name: CycloneDX SBOM and license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Resolve locked packages
        run: flutter pub get

      - name: Generate CycloneDX SBOM from pubspec.lock
        run: python3 tool/ci/generate_sbom.py --lock pubspec.lock --out sbom/orbits.cdx.json

      - name: SBOM must list packages, versions, and sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          bom = json.loads(Path("sbom/orbits.cdx.json").read_text())
          assert bom["bomFormat"] == "CycloneDX"
          assert bom["specVersion"] == "1.5"
          comps = bom["components"]
          assert len(comps) > 20, len(comps)
          for c in comps:
              assert c["name"]
              assert c["version"]
              props = {p["name"]: p["value"] for p in c.get("properties", [])}
              assert "source" in props
          print("sbom components", len(comps))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbits-sbom
          path: sbom/orbits.cdx.json
          if-no-files-found: error
          retention-days: 30
