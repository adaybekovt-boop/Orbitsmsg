# Pin GitHub Actions to full commit SHAs (U-3). Least-privilege
# contents:read. Secret scanning (Gitleaks) + basic SAST (Semgrep).
name: Security scans

on:
  push:
    branches: [main, master]
  # No branches: filter — same reason as build.yml (stacked Phase PRs).
  pull_request:
  schedule:
    # Weekly catch-up if a PR slipped through without a scan.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Official action; public repos do not need GITLEAKS_LICENSE.
      # Config: repo-root .gitleaks.toml (extends default). Scheduled
      # runs scan full history; local preference key names are allowlisted.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: python3 -m pip install --user 'semgrep==1.110.0'

      - name: Semgrep scan
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --metrics=off \
            --exclude=.git \
            --exclude=build \
            --exclude=.dart_tool \
            --exclude=.fvm
