# Native app-icon generation for Orbits (Android + iOS + Windows).
#
# Web / PWA / Safari "Add to Home Screen" icons are NOT generated here — they
# are hand-tuned, opaque, and committed under web/ (regenerate with
# tool/branding/generate_web_icons.ps1). Android mipmaps are committed so a
# local `flutter build apk` does not ship the default Flutter logo; CI still
# regenerates them from tool/branding/orbits_icon_source.png as a belt-and-
# braces check. Do not `flutter create --overwrite` over android/.
#
#   dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
#
# This IS wired into .github/workflows/build.yml: a "Generate & verify Orbits
# launcher icons" step runs in each native CI job and fails if generation did
# not replace the stock Flutter icon. `flutter_launcher_icons` is a
# dev_dependency and test/branding/launcher_icons_config_test.dart guards this
# config.
flutter_launcher_icons:
  image_path: "tool/branding/orbits_icon_source.png"

  # ── Android: legacy mipmaps + adaptive icon ────────────────────────────
  android: true
  min_sdk_android: 21
  # Dark glass background; the mark (with its own transparent safe-zone margin)
  # rides on top, so the circular/squircle adaptive mask never clips the ring.
  adaptive_icon_background: "#0A0E16"
  adaptive_icon_foreground: "tool/branding/orbits_icon_source.png"

  # ── iOS: complete iPhone/iPad/App Store asset catalog ─────────────────
  ios: true
  remove_alpha_ios: true

  # ── Windows: app_icon.ico ──────────────────────────────────────────────
  windows:
    generate: true
    image_path: "tool/branding/orbits_icon_source.png"
    icon_size: 256

  # Web icons are hand-managed under web/ — do not let the tool overwrite them.
  web:
    generate: false
