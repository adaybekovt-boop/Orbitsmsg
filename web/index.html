<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Orbits — P2P encrypted messenger.">

  <!--
    NOTE: Drift on web needs SharedArrayBuffer (used by sqlite3.wasm + the
    drift worker for fast cross-isolate transfers). SharedArrayBuffer is
    only enabled when the document is cross-origin-isolated, which
    requires two HTTP response headers:

      Cross-Origin-Embedder-Policy: require-corp
      Cross-Origin-Opener-Policy:   same-origin

    These headers MUST be sent by the server — the <meta> form is not
    accepted by browsers for these specific values. See:
      - tool/serve_web.dart  (local dev with the right headers)
      - docs/deployment.md   (production hosting cookbook, when added)

    Without them, Drift silently falls over to its IndexedDB fallback,
    which is roughly 10× slower per query.
  -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Orbits">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Orbits</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      const cleanupKey = 'orbits-flutter-web-cleanup-v1';

      // ── Device gate ────────────────────────────────────────────────────
      // Block mobile *phones* from the web version BEFORE the Flutter bundle
      // loads, so the main app never starts on a phone (requirement: "don't
      // load the main functionality"). Tablets/iPad and desktops are allowed.
      //
      // Detection does NOT rely on screen width (a small laptop window must
      // not be mistaken for a phone). Primary signal is UA-Client-Hints
      // (`navigator.userAgentData.mobile`); we fall back to UA-string checks.
      // The Dart side and the embedded signaling server mirror this logic
      // (see lib/core/mobile_ua.dart) for defense in depth.
      function isMobilePhone() {
        const nav = window.navigator || {};
        const ua = nav.userAgent || '';
        // UA-CH: authoritative phone flag on Chromium/Android.
        if (nav.userAgentData && nav.userAgentData.mobile === true) return true;
        // iPhone / iPod. (iPadOS reports a "Macintosh" desktop UA → allowed.)
        if (/iPhone|iPod/i.test(ua)) return true;
        // Android phones carry the "Mobile" token; Android tablets omit it.
        if (/Android/i.test(ua) && /Mobile/i.test(ua)) return true;
        // Legacy mobile browsers.
        if (/(BlackBerry|BB10|IEMobile|Opera Mini|webOS|Windows Phone)/i.test(ua)) {
          return true;
        }
        return false;
      }

      function renderBlocked() {
        document.title = 'Orbits — откройте с компьютера';
        document.body.innerHTML =
          '<div style="position:fixed;inset:0;display:flex;align-items:center;' +
          'justify-content:center;padding:24px;box-sizing:border-box;' +
          'background:#0f1115;color:#e8eaed;font-family:-apple-system,' +
          'BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">' +
          '<div style="max-width:420px;text-align:center;">' +
          '<div style="font-size:48px;line-height:1;margin-bottom:20px;">🖥️</div>' +
          '<h1 style="font-size:20px;font-weight:700;margin:0 0 12px;">' +
          'Доступ с мобильных устройств запрещён</h1>' +
          '<p style="font-size:15px;line-height:1.5;margin:0;opacity:.75;">' +
          'Веб-версия Orbits недоступна на телефонах. Пожалуйста, откройте ' +
          'сайт с компьютера или ноутбука.</p>' +
          '</div></div>';
      }

      if (isMobilePhone()) {
        window.__orbitsAccessDenied = true;
        renderBlocked();
        return;
      }
      // Publish the verdict so the Dart in-app gate (device_access_web.dart)
      // can read it as a backstop.
      window.__orbitsAccessDenied = false;

      function loadFlutter() {
        const script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }

      async function clearLegacyPwa() {
        let removedSomething = false;

        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          const results = await Promise.all(registrations.map((registration) => {
            const scopePath = new URL(registration.scope).pathname;
            return scopePath.startsWith('/tkmessenger/')
              ? registration.unregister()
              : Promise.resolve(false);
          }));
          if (results.some(Boolean)) removedSomething = true;
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          if (keys.length) removedSomething = true;
          await Promise.all(keys.map((key) => caches.delete(key)));
        }

        // Reload exactly once per session if we actually removed a stale SW or
        // cache, OR an old service worker is still controlling this document —
        // either means the bytes on screen may be the legacy React PWA. The
        // unregister + cache clear above are idempotent; only the reload is
        // guarded so we never loop.
        const controlled =
          !!(navigator.serviceWorker && navigator.serviceWorker.controller);
        if ((removedSomething || controlled) &&
            !sessionStorage.getItem(cleanupKey)) {
          sessionStorage.setItem(cleanupKey, '1');
          window.location.reload();
          return new Promise(() => {});
        }
      }

      clearLegacyPwa().catch(console.warn).finally(loadFlutter);
    })();
  </script>
</body>
</html>
