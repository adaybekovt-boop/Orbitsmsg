<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Orbits — P2P encrypted messenger.">

  <!--
    NOTE: Drift on web needs SharedArrayBuffer (used by sqlite3.wasm + the
    drift worker for fast cross-isolate transfers). SharedArrayBuffer is
    only enabled when the document is cross-origin-isolated, which
    requires two HTTP response headers:

      Cross-Origin-Embedder-Policy: require-corp
      Cross-Origin-Opener-Policy:   same-origin

    These headers MUST be sent by the server — the <meta> form is not
    accepted by browsers for these specific values. See:
      - tool/serve_web.dart  (local dev with the right headers)
      - docs/deployment.md   (production hosting cookbook, when added)

    Without them, Drift silently falls over to its IndexedDB fallback,
    which is roughly 10× slower per query.
  -->

  <!-- Dark glass theme — status bar + browser chrome. -->
  <meta name="theme-color" content="#0A0E16">

  <!-- PWA / "Add to Home Screen" (Android + iOS Safari). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orbits">

  <!-- iOS home-screen icon. Opaque (no transparency → no black composite in
       Safari). 180x180 is the size iOS uses for the home screen. -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Orbits</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      const cleanupKey = 'orbits-flutter-web-cleanup-v1';

      function loadFlutter() {
        const script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }

      async function clearLegacyPwa() {
        let removedSomething = false;

        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          const results = await Promise.all(registrations.map((registration) => {
            const scopePath = new URL(registration.scope).pathname;
            return scopePath.startsWith('/tkmessenger/')
              ? registration.unregister()
              : Promise.resolve(false);
          }));
          if (results.some(Boolean)) removedSomething = true;
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          if (keys.length) removedSomething = true;
          await Promise.all(keys.map((key) => caches.delete(key)));
        }

        // Reload exactly once per session if we actually removed a stale SW or
        // cache, OR an old service worker is still controlling this document —
        // either means the bytes on screen may be the legacy React PWA. The
        // unregister + cache clear above are idempotent; only the reload is
        // guarded so we never loop.
        const controlled =
          !!(navigator.serviceWorker && navigator.serviceWorker.controller);
        if ((removedSomething || controlled) &&
            !sessionStorage.getItem(cleanupKey)) {
          sessionStorage.setItem(cleanupKey, '1');
          window.location.reload();
          return new Promise(() => {});
        }
      }

      clearLegacyPwa().catch(console.warn).finally(loadFlutter);
    })();
  </script>
</body>
</html>
