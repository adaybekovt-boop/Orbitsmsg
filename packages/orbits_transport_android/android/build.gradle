group = "app.orbits.transport"
version = "0.1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0")
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "app.orbits.transport"
    compileSdk = 35
    defaultConfig {
        minSdk = 24
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Optional local Bare binary as an asset. Never downloaded.
def orbitsBareSlot = file("${project.projectDir}/../../../../tool/bare/android-arm64/bare")
def orbitsBareAsset = file("${project.projectDir}/src/main/assets/bare")
if (orbitsBareSlot.exists() || orbitsBareAsset.exists()) {
    android.sourceSets.main.assets.srcDirs += ["src/main/assets"]
}

dependencies {
    implementation("androidx.annotation:annotation:1.9.1")
}
