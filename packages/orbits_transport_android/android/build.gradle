group = "app.orbits.transport"
version = "0.1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0")
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "app.orbits.transport"
    compileSdk = 35
    defaultConfig {
        minSdk = 24
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Optional local Bare binary as an asset. Never downloaded.
// projectDir is packages/orbits_transport_android/android — three parents
// reach the repo root (not four).
def orbitsBareSlot = file("${project.projectDir}/../../../tool/bare/android-arm64/bare")
def orbitsBareAssetDir = file("${project.projectDir}/src/main/assets")
def orbitsBareAsset = file("${orbitsBareAssetDir}/bare")

def orbitsStdlibZip = file("${project.projectDir}/../../../tool/connectivity_harness/bare_stdlib.zip")
def orbitsStdlibAsset = file("${orbitsBareAssetDir}/bare_stdlib.zip")

// Copy into a generated dir, never into src/main/assets. Writing the
// Copy outputs over the source-set directory makes generateReleaseLintModel
// consume those files without a declared dependency (AGP 8 fails the
// assemble). CI already places assets via embed.sh / embed-bare-stdlib.sh;
// these tasks are the local-dev fallback when those files are absent.
def generatedBareAssets = file("${project.buildDir}/generated/orbitsBareAssets")
generatedBareAssets.mkdirs()

tasks.register("copyOrbitsBareAsset", Copy) {
    description = "Copy a local android-arm64 Bare slot into generated assets. Never downloads."
    onlyIf { orbitsBareSlot.exists() && !orbitsBareAsset.exists() }
    from(orbitsBareSlot)
    into(generatedBareAssets)
    rename { "bare" }
}

tasks.register("copyOrbitsBareStdlibAsset", Copy) {
    description = "Copy a local bare-* stdlib zip into generated assets. Never downloads."
    onlyIf { orbitsStdlibZip.exists() && !orbitsStdlibAsset.exists() }
    from(orbitsStdlibZip)
    into(generatedBareAssets)
    rename { "bare_stdlib.zip" }
}

android.sourceSets.main.assets.srcDir(generatedBareAssets)

afterEvaluate {
    tasks.matching {
        def n = it.name
        n != "copyOrbitsBareAsset" &&
            n != "copyOrbitsBareStdlibAsset" &&
            (
                (n.contains("Assets") &&
                    (n.startsWith("merge") || n.startsWith("package"))) ||
                n.contains("LintModel") ||
                (n.startsWith("generate") && n.contains("Lint"))
            )
    }.configureEach {
        dependsOn("copyOrbitsBareAsset", "copyOrbitsBareStdlibAsset")
    }
}

dependencies {
    implementation("androidx.annotation:annotation:1.9.1")
}
