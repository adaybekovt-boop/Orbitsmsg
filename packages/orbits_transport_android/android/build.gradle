group = "app.orbits.transport"
version = "0.1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0")
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "app.orbits.transport"
    compileSdk = 35
    defaultConfig {
        minSdk = 24
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Optional local Bare binary as an asset. Never downloaded.
// projectDir is packages/orbits_transport_android/android — three parents
// reach the repo root (not four).
def orbitsBareSlot = file("${project.projectDir}/../../../tool/bare/android-arm64/bare")
def orbitsBareAssetDir = file("${project.projectDir}/src/main/assets")
def orbitsBareAsset = file("${orbitsBareAssetDir}/bare")

tasks.register("copyOrbitsBareAsset", Copy) {
    description = "Copy a local android-arm64 Bare slot into plugin assets. Never downloads."
    onlyIf { orbitsBareSlot.exists() }
    from(orbitsBareSlot)
    into(orbitsBareAssetDir)
    rename { "bare" }
}

afterEvaluate {
    tasks.matching {
        it.name != "copyOrbitsBareAsset" &&
            it.name.contains("Assets") &&
            (it.name.startsWith("merge") || it.name.startsWith("package"))
    }.configureEach {
        dependsOn("copyOrbitsBareAsset")
    }
}

if (orbitsBareSlot.exists() || orbitsBareAsset.exists()) {
    android.sourceSets.main.assets.srcDirs += ["src/main/assets"]
}

dependencies {
    implementation("androidx.annotation:annotation:1.9.1")
}
