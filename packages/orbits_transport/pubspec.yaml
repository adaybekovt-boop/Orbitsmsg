name: orbits_transport
description: Federated Orbits transport plugin facade. Platform Bare hosts land in sibling packages.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.12.0 <3.13.0"
  flutter: ">=3.44.7 <3.45.0"

dependencies:
  flutter:
    sdk: flutter
  orbits_transport_platform_interface:
    path: ../orbits_transport_platform_interface
  orbits_transport_android:
    path: ../orbits_transport_android
  orbits_transport_ios:
    path: ../orbits_transport_ios
  orbits_transport_linux:
    path: ../orbits_transport_linux
  orbits_transport_macos:
    path: ../orbits_transport_macos
  orbits_transport_windows:
    path: ../orbits_transport_windows

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: orbits_transport_android
      ios:
        default_package: orbits_transport_ios
      linux:
        default_package: orbits_transport_linux
      macos:
        default_package: orbits_transport_macos
      windows:
        default_package: orbits_transport_windows
