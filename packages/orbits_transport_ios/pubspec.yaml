name: orbits_transport_ios
description: iOS Bare worklet host for Orbits transport. Bundle is embedded at build time; remote JS is forbidden.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.12.0 <3.13.0"
  flutter: ">=3.44.7 <3.45.0"

dependencies:
  flutter:
    sdk: flutter
  orbits_transport:
    path: ../orbits_transport
  orbits_transport_platform_interface:
    path: ../orbits_transport_platform_interface

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  plugin:
    implements: orbits_transport
    platforms:
      ios:
        pluginClass: OrbitsTransportPlugin
        dartPluginClass: OrbitsTransportIos
